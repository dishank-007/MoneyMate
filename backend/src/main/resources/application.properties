server.port=${PORT:8080}
server.error.include-message=always

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:moneymate}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
moneymate.jwt.secret=${JWT_SECRET:9a3b6c8e2d1f4a5b7c9e0d2f4a6b8c1d3e5f7a9b0c2d4e6f8a1b3c5d7e9f0a2b}
moneymate.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.moneymate=INFO
logging.level.org.springframework.security=WARN
